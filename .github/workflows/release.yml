# A tagged release: verify, attach the two assets under their own sha256, then open the catalogue PR
# against the extensions **registry** — which is what makes the version installable without a
# Tetravox release. The fragments are still printed in the job summary as the fallback for a run with
# no `CATALOGUE_TOKEN`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to (re)publish assets for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Read once here so the catalogue steps can be *skipped* on `if:` rather than failing: a repo
    # with no cross-repo token still cuts releases exactly as it did before, and the job summary's
    # paste-it-yourself fragment is still printed.
    env:
      CATALOGUE_TOKEN: ${{ secrets.CATALOGUE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-contacts.mjs

      # The same gate CI runs. A release is not a second, laxer path to the same artefact.
      - run: pnpm run verify

      - name: Publish the assets, content-addressed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "${{ inputs.tag || github.ref_name }}" --upload

      # The fragments are what a human pastes into `idossha/tetravox`'s `modules.lock` and
      # `idossha/tetravox-extensions`'s `index.json`. Putting them in the job summary is what makes
      # that a copy rather than a retyping.
      - name: Print the modules.lock and registry fragments
        run: |
          {
            echo '## Paste these'
            echo '```json'
            node scripts/print-fragments.mjs "${{ inputs.tag || github.ref_name }}" "${{ github.repository }}" \
              "index.js $(wc -c < dist/index.js) $(sha256sum dist/index.js | cut -d' ' -f1)" \
              "manifest.json $(wc -c < dist/manifest.json) $(sha256sum dist/manifest.json | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- the catalogue, opened as a PR rather than left to somebody's memory ----------------
      #
      # **Against `idossha/tetravox-extensions`, not the app repository.** The app fetches that
      # registry's `index.json` at launch and merges it over the copy it shipped with, so a version
      # that lands there is offered the day the PR is merged. The old target -- the app's shipped
      # copy -- is only read when there is no network, and a new entry in it reaches nobody until a
      # *core* release is built and downloaded. That is why every extension release has been
      # dragging a Tetravox release behind it, and it is the whole point of this change.
      #
      # The paste also *cannot* happen before the release exists -- the app verifies a download
      # against the sha256 in its own URL -- which puts it after the point everyone treats the
      # release as finished. Hence a job step and not a checklist line.
      #
      # A PR and not a push: the catalogue is another repository's file, it goes through that repo's
      # validator, and a human still says yes. With `CATALOGUE_TOKEN` unset (it is, today) every
      # step below is skipped and the job summary's fragments above remain the fallback: paste them
      # into the registry's `index.json` by hand.
      - name: Check out the extensions registry
        if: env.CATALOGUE_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: idossha/tetravox-extensions
          token: ${{ secrets.CATALOGUE_TOKEN }}
          path: .catalogue

      - name: Build the catalogue entry
        if: env.CATALOGUE_TOKEN != ''
        id: entry
        run: |
          node scripts/print-fragments.mjs "${{ inputs.tag || github.ref_name }}" "${{ github.repository }}" --registry-json \
            "index.js $(wc -c < dist/index.js) $(sha256sum dist/index.js | cut -d' ' -f1)" \
            "manifest.json $(wc -c < dist/manifest.json) $(sha256sum dist/manifest.json | cut -d' ' -f1)" > entry.json
          node scripts/insert-catalogue-entry.mjs .catalogue/index.json entry.json --id tetravox.seeg

      # The registry owns the rules an entry must satisfy -- the asset is named by its own sha256,
      # the URL is under the repo the entry claims, both files are present, versions sorted oldest
      # first. Running *its* validator here means a malformed entry fails in this job, where the
      # numbers came from, instead of in a review round trip. `|| true` on the absence of the script
      # only: a registry that has not got one yet must not break a release.
      - name: Validate the entry against the registry's own rules
        if: env.CATALOGUE_TOKEN != '' && steps.entry.outputs.changed == 'true'
        working-directory: .catalogue
        run: |
          if [ -f scripts/validate-index.mjs ]; then
            node scripts/validate-index.mjs
          else
            echo 'the registry ships no validate-index.mjs; skipping'
          fi

      - name: Open the catalogue PR
        if: env.CATALOGUE_TOKEN != '' && steps.entry.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOGUE_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SEEG_REPO: ${{ github.repository }}
        working-directory: .catalogue
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BRANCH="chore/seeg-catalogue-${VERSION}"

          # Heredocs, not inline `-m` / `--body` strings. Continuation lines in an inline argument
          # keep whatever indentation the YAML gave them, and four leading spaces is a markdown code
          # block -- the PR body is read by people, so it has to survive the trip intact.
          cat > /tmp/commit-msg.txt <<MSG
          chore(catalogue): sEEG contacts ${VERSION}

          Opened by tetravox-seeg's release workflow from the assets it had just
          published and verified. Every hash is the one the release was checked
          against, and each URL is the asset's own sha256.
          MSG

          cat > /tmp/pr-body.md <<BODY
          Opened automatically by [tetravox-seeg ${TAG}](https://github.com/${SEEG_REPO}/releases/tag/${TAG}).

          The hashes come off the published assets, so the entry is verifiable the moment it lands: the app refuses any download whose bytes do not match the sha256 in its own URL. \`permissions\` is \`derivePermissions()\` over the shipped manifest rather than a copy of the previous release's.

          Merging makes ${VERSION} appear in File > Extensions... for everyone on a current Tetravox, with no core release: the app fetches this index at launch and merges it over the copy it shipped with.
          BODY

          git config user.name 'tetravox-seeg release'
          git config user.email 'noreply@github.com'
          git switch -c "$BRANCH"
          git add index.json
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"
          gh pr create --repo idossha/tetravox-extensions --base main --head "$BRANCH" \
            --title "chore(catalogue): sEEG contacts ${VERSION}" --body-file /tmp/pr-body.md
